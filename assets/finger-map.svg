<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 984 366" width="984" height="366" role="img" aria-labelledby="fm-title fm-desc" class="finger-map">
<title id="fm-title">Which finger presses each key</title>
<desc id="fm-desc">A US keyboard. Each key is coloured by the finger that presses it: little finger pink, ring finger amber, middle finger yellow, index finger green, thumb teal. Home row keys are A S D F and J K L semicolon.</desc>
<style>.finger-map text{font-family:Nunito,Ubuntu,Arial,sans-serif;font-weight:800;pointer-events:none}.finger-map .key{stroke:rgba(5,11,28,.55);stroke-width:1.5}.finger-map .key.mod{opacity:.55}.finger-map .key.home{stroke:#f3f6ff;stroke-opacity:.7;stroke-width:2}.finger-map .key.is-focus{stroke:#ffffff;stroke-opacity:1;stroke-width:6;filter:drop-shadow(0 0 10px #fff)}.finger-map .legend text{font-size:16px;font-weight:700;fill:#f3f6ff}</style>
